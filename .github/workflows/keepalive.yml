name: DB 일시정지 막기

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 00:00 UTC = 한국 시각 09:00
  workflow_dispatch:      # Actions 탭에서 손으로도 실행할 수 있음

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.2"
      - run: python keepalive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
